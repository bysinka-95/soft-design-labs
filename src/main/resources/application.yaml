spring:
  application:
    name: soft-design-labs

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/soft-design-labs};AUTO_SERVER=TRUE
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
